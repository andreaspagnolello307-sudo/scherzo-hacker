<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Console</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020502;
    color: #45ff68;
    font-family: monospace;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;
}

.terminal {

    width: 100%;
    max-width: 850px;

    min-height: 500px;

    background: #030803;

    border: 1px solid #1c6b2b;

    border-radius: 10px;

    box-shadow:
        0 0 30px rgba(40,255,80,.15);

    overflow: hidden;
}

.top {

    height: 38px;

    background: #0a100b;

    display: flex;

    align-items: center;

    padding-left: 12px;

    color: #6cff83;

    font-size: 13px;
}

.dot {

    width: 9px;
    height: 9px;

    background: #246b31;

    border-radius: 50%;

    display: inline-block;

    margin-right: 6px;
}

.screen {

    padding: 22px;

    line-height: 1.7;

    font-size: 14px;
}

.line {

    margin-bottom: 4px;
}

.progress {

    height: 13px;

    border: 1px solid #237b35;

    padding: 2px;

    margin: 5px 0 16px;
}

.fill {

    height: 100%;

    width: 0%;

    background: #39d65a;

    transition: width .2s;
}

.success {

    color: #9affaa;
}

.warning {

    color: #eaff71;
}

#final {

    display: none;

    text-align: center;

    padding-top: 80px;
}

#final h1 {

    font-size: clamp(32px, 8vw, 65px);

    color: #ff3030;

    text-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000;

    margin-bottom: 20px;

    animation: blink 1s infinite;
}

#final p {

    font-size: 18px;

    color: #ff5555;
}

@keyframes blink {

    0%, 49% {
        opacity: 1;
    }

    50%, 100% {
        opacity: .35;
    }

}

button {

    margin-top: 25px;

    background: #081609;

    border: 1px solid #2c9b43;

    color: #7dff91;

    padding: 10px 18px;

    border-radius: 6px;

    font-family: monospace;

    cursor: pointer;
}

</style>

</head>

<body>

<div class="terminal">

    <div class="top">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

        &nbsp;&nbsp;

        system-console.local

    </div>


    <div class="screen">

        <div id="console"></div>


        <div id="final">

            <h1>
                ATTACCO HACKER IN CORSO
            </h1>

            <p>
                ACCESSO AL SISTEMA IN CORSO...
            </p>

            <p>
                NON CHIUDERE QUESTA PAGINA
            </p>

        </div>

    </div>

</div>


<script>

const consoleBox =
    document.getElementById("console");

const finalScreen =
    document.getElementById("final");


const operations = [

    ["[BOOT] Avvio console di sistema...", 12],

    ["[NET ] Inizializzazione connessione...", 27],

    ["[SCAN] Analisi dispositivo...", 43],

    ["[SCAN] Ricerca porte aperte...", 58],

    ["[AUTH] Verifica autorizzazione...", 71],

    ["[DATA] Preparazione trasferimento...", 86],

    ["[DATA] Trasferimento dati...", 97],

    ["[ OK ] ACCESS GRANTED", 100]

];


function wait(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


async function start() {


    for (const operation of operations) {


        const text =
            operation[0];

        const percentage =
            operation[1];


        const line =
            document.createElement("div");


        line.className =
            percentage === 100
            ? "line success"
            : "line";


        line.textContent =
            text;


        consoleBox.appendChild(line);


        const progress =
            document.createElement("div");


        progress.className =
            "progress";


        const fill =
            document.createElement("div");


        fill.className =
            "fill";


        progress.appendChild(fill);

        consoleBox.appendChild(progress);


        await wait(200);


        fill.style.width =
            percentage + "%";


        await wait(650);

    }


    const finalLine =
        document.createElement("div");


    finalLine.className =
        "warning";


    finalLine.style.marginTop =
        "10px";


    finalLine.textContent =
        "> Operazione completata.";


    consoleBox.appendChild(
        finalLine
    );


    await wait(1200);


    consoleBox.style.display =
        "none";


    finalScreen.style.display =
        "block";

}


start();

</script>

</body>
</html>
